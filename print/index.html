<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIPOVERSE — بطاقات QR للطباعة</title>
<style>
  body { margin: 0; background: #141218; color: #F7F4FC; font-family: Inter, "Segoe UI", sans-serif; }
  .bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 18px; }
  a, button { font: inherit; font-weight: 700; color: #141218; background: #C4B5FD; border: 0; border-radius: 10px; padding: 10px 14px; text-decoration: none; cursor: pointer; }
  p { margin: 0; color: #EDE4FF; }
  img { width: min(100%, 900px); display: block; margin: 0 auto 24px; background: #fff; }
  @media print { .bar { display: none; } body { background: #fff; } img { width: 100%; } }
</style>
</head>
<body>
  <div class="bar">
    <p><strong>ورقة A4</strong> — أربع بطاقات. كل بطاقة فيها شكل المنصة والكود. قص من الخطوط المتقطعة.</p>
    <span>
      <a href="lipoverse-qr-sheet.pdf">PDF</a>
      <button type="button" onclick="print()">Print</button>
    </span>
  </div>
  <img src="lipoverse-qr-sheet.png" alt="Four printable LIPOVERSE cards, each with the liposome mark and a QR code">
</body>
</html>
